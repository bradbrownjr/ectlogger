# Screenshot manifest for ectlogger.us
#
# This file holds the site-wide defaults and the handful of figures that do not
# belong to any one documentation path. Everything else lives in
# requests/<section>.yml and is merged in automatically, so the people writing
# a path are not all editing one file.
#
# See README.md in this directory for the field reference and the rules.

defaults:
  # 1440 wide is the narrowest desktop the wide-screen dock still behaves at,
  # and tall enough that the check-in table is not cut off mid-row. Deliberately
  # not full_page: the application shell sets overflow: hidden on its root, so a
  # full-page capture silently truncates to one screen.
  viewport:
    width: 1440
    height: 1000
  scale: 2
  timezone: America/New_York
  settle: 500

  # Transient overlays that would date a figure or cover it. A shot that
  # actually wants to show one overrides this with its own empty hide list.
  hide:
    - '.MuiSnackbar-root'

  local_storage:
    # Light mode throughout. The repository made this call once already
    # (commit eaff80c) and the layout's light-only/dark-only image swap has
    # been dead code ever since. Halving the capture count is worth more than
    # showing the dark theme in every figure; it gets one dedicated shot.
    theme: light

shots:
  - id: hero
    section: landing
    page: /
    route: /nets/{{net:active}}
    as: W1PINE
    # ":visible" is Playwright's own pseudo-class, not CSS. The net view renders
    # a desktop table and a mobile one, only one of which is laid out, so every
    # table selector in this manifest needs it.
    wait_for: 'table:visible tbody tr'
    alt: >
      A live net in ECTLogger: fourteen stations in the check-in list with their
      statuses and locations, frequency chips above the table, and the net
      control toolbar across the top.
    caption: A net in progress, seen by Net Control.

  # Proves the annotation mechanism end to end. Kept as a real figure rather
  # than a test fixture, because the net toolbar is what a new Net Control
  # operator needs pointed out first.
  - id: toolbar-speed-entry
    section: net-control
    page: /docs/net-control/speed-entry/
    route: /nets/{{net:active}}
    as: W1PINE
    wait_for: 'table:visible tbody tr'
    # The toolbar row is an unnamed flex container, so it is addressed through
    # a control that is definitely in it rather than through an emotion-
    # generated class name that changes whenever the styles are touched.
    element: 'div:has(> span[aria-label="Bulk add multiple check-ins"])'
    pad: 10
    annotate:
      - selector: 'span[aria-label="Bulk add multiple check-ins"]'
        style: box
    alt: >
      The net control toolbar, with the leftmost button, labelled "Bulk add",
      outlined in red. The rest of the row reads Search, Map, Traffic,
      Announcements, Notes, Topics, Stats, Import, Edit net, Roles, Role: NCS,
      Step away, Just listening, Check out, Close net.
    caption: >
      Speed entry is the "Bulk add" button at the left end of the net toolbar.
      Its tooltip reads "Bulk add multiple check-ins".
