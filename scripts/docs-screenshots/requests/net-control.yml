# Figure requests for the Net control path (docs/net-control/). See
# scripts/docs-screenshots/README.md for the schema and placeholder syntax.
# Perspective callsigns per docs/DEVELOPMENT.md's roster: W1PINE (NCS) is the
# primary "you" of this path, K1COVE (Logger) and N1LAKE (Relay) stand in for
# the other two net-control roles where the page is specifically about them.
#
# Two figures below are reused across paths rather than re-declared:
#   - toolbar-speed-entry is already embedded by docs/reference/speed-entry-syntax.md
#     (that page's own draft named this id and this section before this file
#     existed); it is declared here because this file is what actually owns
#     docs/img/net-control/*.
#   - reference/check-in-legend (declared in requests/reference.yml, not here)
#     is embedded again by the-net-control-desk.md and
#     frequencies-and-multi-ncs.md by pointing at its existing image path --
#     not redeclared, since a section owns its own ids only.

shots:
  # ========== The net control desk (tour) ==========
  - id: command-bar-ncs
    section: net-control
    page: /docs/net-control/the-net-control-desk/
    route: /nets/{{net:active}}
    as: W1PINE
    wait_for: 'table:visible tbody tr'
    # No single selector wraps the whole command bar (it is a plain flex Box
    # with no id/aria-label of its own -- see NetViewHeader.tsx), so the clip
    # is the union of the row's first and last button, which spans the row.
    element:
      - 'span[aria-label="Bulk add multiple check-ins"]'
      - 'span[aria-label="Close net"]'
    pad: 10
    alt: >
      The net control command bar as Net Control Station sees it on an active
      net, reading left to right: Bulk add, Search, Map, Traffic,
      Announcements, Notes, Topics, Stats, Import, Edit net, Roles, Role: NCS,
      Step away, Just listening, Check out, Close net.
    caption: >
      Every button here is gated by who you are and what state the net is in
      -- a Standard participant, a Logger, and a Relay operator each see a
      different subset of this same row.

  - id: toolbar-speed-entry
    section: net-control
    page: /docs/net-control/speed-entry/
    route: /nets/{{net:active}}
    as: W1PINE
    wait_for: 'table:visible tbody tr'
    element:
      - 'span[aria-label="Bulk add multiple check-ins"]'
      - 'span[aria-label="Close net"]'
    pad: 10
    annotate:
      - selector: 'span[aria-label="Bulk add multiple check-ins"]'
        style: box
    alt: >
      The net control toolbar, with the leftmost button, labelled "Bulk add",
      outlined in red. The rest of the row reads Search, Map, Traffic,
      Announcements, Notes, Topics, Stats, Import, Edit net, Roles, Role: NCS,
      Step away, Just listening, Check out, Close net.
    caption: The Bulk add button, leftmost in the net control toolbar.

  # ========== Logging check-ins ==========
  - id: inline-edit-open
    section: net-control
    page: /docs/net-control/logging-check-ins/
    route: /nets/{{net:active}}
    as: W1PINE
    wait_for: 'table:visible tbody tr'
    # The row stops matching :has-text("KC1HILL") the moment it opens for
    # editing: the callsign moves out of the cell's text and into an input's
    # value attribute, which Playwright's text matching does not see. So the
    # click targets the row by callsign and everything after it targets the one
    # row that has an input in its callsign cell, which is only ever this one.
    steps:
      - click: 'tr:has-text("KC1HILL") td[data-field="callsign"]'
      - wait_for: 'tr:has(td[data-field="callsign"] input)'
    # Not the whole row: the table is wider than the space it is given and runs
    # on underneath the chat panel, so a clip to the tr picks up a slice of chat
    # down the right-hand side (same reason start.yml's checked-in-row clips to
    # the container instead). The first cell through Location covers every field
    # that turns into a text box, which is what this figure is for.
    element:
      - 'tr:has(td[data-field="callsign"] input) td:first-child'
      - 'tr:has(td[data-field="callsign"] input) td[data-field="location"]'
    pad: 4
    alt: >
      A check-in row for KC1HILL open for inline editing, with the Callsign,
      Name, and Location cells replaced by text fields you can type into
      directly.
    caption: Click anywhere on a row to edit it in place. Enter or clicking away saves it; Escape cancels.

  # ========== Speed entry ==========
  - id: bulk-add-textarea
    section: net-control
    page: /docs/net-control/speed-entry/
    route: /nets/{{net:active}}
    as: W1PINE
    wait_for: 'table:visible tbody tr'
    # Bulk add is a draggable panel, not a dialog: BulkCheckIn.tsx renders a
    # bare Paper with a .drag-handle, so there is no .MuiDialog-paper to wait
    # for. Captured empty, because this page's point is the Format line.
    steps:
      - click: 'span[aria-label="Bulk add multiple check-ins"]'
      - wait_for: '.drag-handle'
    element: 'div:has(> .drag-handle)'
    pad: 16
    alt: >
      The Bulk Check-In window: a single multi-line text box for entering
      several check-ins at once, with a live "Format:" line showing the
      exact field order this net expects.
    caption: The box accepts one check-in per line-segment, separated by semicolons -- see Speed entry syntax for the exact grammar.

  # ========== Frequencies and multiple net controls ==========
  - id: frequency-chips-claimed
    section: net-control
    page: /docs/net-control/frequencies-and-multi-ncs/
    route: /nets/{{net:active}}
    as: W1PINE
    wait_for: 'table:visible tbody tr'
    # This net has two active NCS (W1PINE, W1PORT) each claimed to a
    # different frequency; the union of their two chips is what the page
    # needs to show, in their two different NCS colors.
    element:
      - 'div[aria-label*="YOUR claimed frequency"]'
      - 'div[aria-label*="W1PORT is monitoring"]'
    pad: 12
    alt: >
      Two frequency chips in the net header: 146.940 MHz FM outlined in red,
      labelled as the frequency you have claimed, and Brandmeister TG31234 DMR
      outlined in blue, labelled as the one W1PORT is monitoring.
    caption: >
      Those coloured outlines are the app's own, not a callout on this page.
      Each active NCS claims a different chip, and the colour follows the
      operator -- the same red marks W1PINE's row in the check-in list.

  # ========== Roles and stepping away ==========
  - id: manage-roles-dialog
    section: net-control
    page: /docs/net-control/roles-and-stepping-away/
    route: /nets/{{net:active}}
    as: W1PINE
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'span[aria-label="Manage NCS and logger roles"]'
      - wait_for: '.MuiDialog-paper:visible'
    element: '.MuiDialog-paper'
    pad: 12
    annotate:
      - selector: '.MuiDialog-paper button:has-text("Assign Role")'
        style: box
    alt: >
      The Manage Net Control Staff dialog: a Select User picker, a Role picker
      set to NCS (Net Control Station), the Assign Role button outlined in red,
      and a Current Assignments list naming W1PINE and W1PORT as NCS, K1COVE as
      Logger, and N1LAKE as Relay, each with its own remove control.
    caption: Assigning a role here works alongside self check-in -- either path can put someone in NCS or Logger.

  - id: ncs-role-toggle
    section: net-control
    page: /docs/net-control/roles-and-stepping-away/
    route: /nets/{{net:active}}
    as: W1PINE
    wait_for: 'table:visible tbody tr'
    element: 'span[aria-label="Acting as NCS — click to step down to Standard"]'
    pad: 10
    annotate:
      - selector: 'span[aria-label="Acting as NCS — click to step down to Standard"]'
        style: box
    alt: >
      The "Role: NCS" toolbar button, outlined in red, with the tooltip
      "Acting as NCS -- click to step down to Standard".
    caption: This toggles your own active/standard status on the NCS role you already hold -- it never grants NCS for the first time.

  # ========== Chat moderation ==========
  - id: chat-mute-hover
    section: net-control
    page: /docs/net-control/chat-moderation/
    route: /nets/{{net:active}}
    as: K1COVE
    wait_for: 'table:visible tbody tr'
    steps:
      - hover: 'li:has-text("Copy, listening on the repeater")'
      - wait: 300
    element: 'li:has-text("Copy, listening on the repeater")'
    pad: 10
    annotate:
      - selector: 'svg[data-testid="VolumeOffIcon"]'
        style: box
    alt: >
      A chat message from KC1HILL with a hover toolbar showing reaction,
      reply, and mute icons; the mute icon is outlined in red.
    caption: >
      A plain click mutes a station for you only. As Logger or NCS,
      shift-click the same icon to mute them for everyone in this net's chat.

  - id: muted-stations-dialog
    section: net-control
    page: /docs/net-control/chat-moderation/
    route: /nets/{{net:active}}
    as: K1COVE
    wait_for: 'table:visible tbody tr'
    steps:
      - hover: 'li:has-text("Copy, listening on the repeater")'
      - click: 'svg[data-testid="VolumeOffIcon"]'
      - wait_for: 'text=Manage'
      - click: 'button:has-text("Manage")'
      - wait_for: '.MuiDialog-paper:visible'
    element: '.MuiDialog-paper'
    pad: 12
    alt: >
      The Muted Stations dialog, listing KC1HILL under "Your personal mutes"
      with an Unmute link, above a separate "Muted for everyone" section
      reading "No stations muted for everyone." 
    caption: Personal mutes and net-wide mutes are managed in the same dialog but never mix with each other.

  # ========== Handling traffic ==========
  - id: traffic-panel-docked
    section: net-control
    page: /docs/net-control/handling-traffic/
    # W1PINE, the net's owner. K1COVE, this net's active Logger, would do just
    # as well now that the role-case bug is fixed (2026-09-19) and the panel
    # opens for a net's own NCS and Logger again; the owner's seat is kept
    # because the rest of this section's figures are taken from it and the
    # panel renders identically from either.
    route: /nets/{{net:active}}
    as: W1PINE
    # Wider than the usual 1440 so the Traffic panel's own table has room for
    # its Disposition column; at 1440 the panel cuts the status chip in half.
    viewport:
      width: 1680
      height: 700
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'span[aria-label="View and file traffic for this net"]'
      - wait_for: '[title="File traffic on this net"]:visible'
    # The button keeps its tooltip open after the click, over the check-in
    # list's Callsign header.
    hide:
      - '.MuiTooltip-popper'
    alt: >
      The Traffic panel docked below Chat beside the check-in list, showing a
      "pending: 1" summary chip above a table of one urgent ICS-213 addressed
      to EOC Logistics.
    caption: The Traffic panel opens beside the check-in list -- filing and viewing traffic never leaves the net view.

  - id: file-traffic-dialog
    section: net-control
    page: /docs/net-control/handling-traffic/
    route: /nets/{{net:active}}
    # W1PINE for the same reason as traffic-panel-docked above.
    as: W1PINE
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'span[aria-label="View and file traffic for this net"]'
      - wait_for: '[title="File traffic on this net"]:visible'
      - click: '[title="File traffic on this net"]'
      - wait_for: '.MuiDialog-paper:visible'
      # The dialog paints before its form definitions arrive, and the first
      # capture of it was an empty "Choose a form type" with no cards under it.
      - wait_for: '.MuiDialog-paper .MuiCard-root'
    element: '.MuiDialog-paper'
    pad: 16
    alt: >
      The File traffic dialog's form-type picker, showing cards for the
      message types this net has enabled.
    caption: Only the form types this net turned on appear here; the standalone Traffic section can always reach the rest.

  # ========== Multiple monitors and wide screens ==========
  - id: panel-window-controls
    section: net-control
    page: /docs/net-control/multiple-monitors/
    route: /nets/{{net:active}}
    as: W1PINE
    viewport:
      width: 1440
      height: 700
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'span[aria-label="View and file traffic for this net"]'
      - wait_for: '[title="Detach panel"]:visible'
    # Scoped to one header's control box, and to the Traffic panel's, because
    # that is the only panel carrying all four: Chat and the Activity Log are
    # always present and so have no Close. Unscoped, ".first()" resolved
    # Detach/Minimize against Chat's header and Close against Traffic's, and
    # the union spanned the whole right-hand column between them.
    element:
      - 'div:has(> button[title="Close"]) > button[title="Detach panel"]'
      - 'div:has(> button[title="Close"]) > button[title="Close"]'
    # The controls sit about 4px apart, so any padding at all lets the next
    # icon along show at the edge. 6 is the least that does not crop the boxes.
    pad: 6
    annotate:
      - selector: 'div:has(> button[title="Close"]) > button[title="Open in new window"]'
        style: box
    alt: >
      A docked panel's title bar controls: detach, open in new window
      (outlined in red), minimize, and close.
    caption: Every docked panel -- Chat, Activity Log, Map, Coverage, Traffic -- carries this same row.

  - id: popped-out-checkins
    section: net-control
    page: /docs/net-control/multiple-monitors/
    route: /nets/{{net:active}}/pane/check-ins
    as: W1PINE
    viewport:
      width: 1100
      height: 750
    wait_for: 'table:visible tbody tr'
    alt: >
      The check-in list open in its own bare browser window, with no
      navigation bar, ready to be dragged onto a second monitor.
    caption: A popped-out pane is a real second window with its own connection to the net -- move it to another monitor and it keeps working on its own.

  - id: ultrawide-desk
    section: net-control
    page: /docs/net-control/multiple-monitors/
    route: /nets/{{net:active}}
    as: W1PINE
    # xl and up is the only width where the left dock column exists
    # (useLayoutTier.ts). Scale 1, or a 2400px-wide page becomes a 4800px PNG.
    viewport:
      width: 2400
      height: 1100
    scale: 1
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'button:has-text("Notes")'
      - wait: 600
      - click: 'button:has-text("Announcements")'
      - wait: 800
    alt: >
      The whole net view on an ultrawide monitor, in three columns: the
      schedule's Announcements and the net's Notes docked on the left, the check-in
      list in the middle, and Chat with the Activity Log on the right.
    caption: >
      At ultrawide widths, Script, Notes, and Announcements get a column of
      their own instead of floating over the list.

  - id: detached-panel
    section: net-control
    page: /docs/net-control/multiple-monitors/
    route: /nets/{{net:active}}
    as: W1PINE
    viewport:
      width: 1440
      height: 900
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'span[aria-label="View and file traffic for this net"]'
      - wait_for: '[title="Detach panel"]:visible'
      - click: '[title="Detach panel"]'
      - wait: 800
    alt: >
      The net view with the Traffic panel detached into a floating window
      that sits over the check-in list, with its own title bar controls.
    caption: >
      Detach keeps a panel in the same browser tab but lets you drag and
      resize it anywhere over the page.

  # ========== Authenticated nets ==========
  - id: identity-padlocks
    section: net-control
    page: /docs/net-control/authenticated-nets/
    route: /nets/{{net:authenticated}}
    as: W1PINE
    viewport:
      width: 1440
      height: 800
    wait_for: 'table:visible tbody tr'
    # Cropped to the first four columns, where the padlocks are: the whole
    # table shrinks to unreadable at phone width.
    element:
      - 'table:visible thead th:nth-child(1)'
      - 'table:visible tr:has-text("N2OAKS") td:nth-child(4)'
    pad: 8
    annotate:
      - selector: 'tr:has-text("K1CAMP") button:has(svg[data-testid="LockOpenIcon"])'
        style: box
    alt: >
      The check-in list of an authenticated net. Each callsign has a padlock
      beside it: closed and green for N1LAKE, whose identity was verified,
      greyed out for N1ROVE, whose account has no two-factor set up, and open
      for the others, with K1CAMP's open padlock outlined in red.
    caption: >
      A closed padlock means someone confirmed the station's code. Net Control
      clicks an open one to check it.

  - id: identity-verify-dialog
    section: net-control
    page: /docs/net-control/authenticated-nets/
    route: /nets/{{net:authenticated}}
    as: W1PINE
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'tr:has-text("K1CAMP") button:has(svg[data-testid="LockOpenIcon"])'
      - wait_for: '.MuiDialog-paper:visible'
    element: '.MuiDialog-paper'
    pad: 16
    alt: >
      The Verify K1CAMP's Identity dialog, showing the station's current
      six-digit code and the one before it, with Cancel, Reject, and Confirm
      Match buttons.
    caption: >
      Ask the operator to read the code from their authenticator app and
      compare it with this one.

  # ========== Closing the net ==========
  - id: close-net-dialog
    section: net-control
    page: /docs/net-control/closing-the-net/
    route: /nets/{{net:active}}
    as: W1PINE
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'span[aria-label="Close net"]'
      - wait_for: '.MuiDialog-paper:visible'
    element: '.MuiDialog-paper'
    pad: 12
    annotate:
      - selector: '.MuiDialog-paper button:has-text("Close Net")'
        style: box
    alt: >
      The Close Net confirmation dialog: "Are you sure you want to close this
      net? This will end the session and send log emails to subscribers,"
      with the Close Net button outlined in red.
    caption: There is no scheduled undo for this -- see Closing the net for what to do if you close one by mistake.

  - id: closed-net-exports
    section: net-control
    page: /docs/net-control/closing-the-net/
    route: /nets/{{net:closed}}
    as: KC1HILL
    wait_for: 'table:visible tbody tr'
    element:
      - 'span[aria-label="Export check-ins to CSV"]'
      - 'span[aria-label="Generate comprehensive net report (PDF)"]'
    pad: 10
    alt: >
      The toolbar on a closed net, as seen by a station with no staff role:
      Export, ICS-309, ICS-309 PDF, and Report.
    caption: Once a net is closed, its exports are open to anyone who can see the net -- only Archive and Delete stay staff-only.
