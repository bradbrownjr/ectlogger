# Figure requests for the Operators path (docs/operators/). See
# scripts/docs-screenshots/README.md for the schema and placeholder syntax.
# All participant-perspective shots use KC1HILL (Priya Nandan), the "you" of
# this path, per docs/DOC-STYLE.md.

shots:
  # ========== Account and profile ==========
  - id: account-profile-tab
    section: operators
    page: /docs/operators/account-and-profile/
    route: /profile
    as: KC1HILL
    wait_for: 'form:visible'
    # The tabs and the form, not the whole window; tall enough to reach Save.
    viewport:
      width: 1440
      height: 1600
    element:
      - '.MuiTabs-root'
      - 'form'
    pad: 12
    alt: >
      The Profile page's Profile tab, showing the Name, Amateur Radio Call
      Sign, GMRS Call Sign, SKYWARN Spotter Number, and Default Location
      fields, with Save Changes at the bottom.
    caption: Your profile identity fields. Only Name is required.

  # ========== Finding a net ==========
  - id: dashboard-net-list
    section: operators
    page: /docs/operators/finding-a-net/
    route: /dashboard
    as: KC1HILL
    # A short viewport, so the figure is the net cards and not a page of
    # empty background below them. The alt text deliberately names no count:
    # it said "three net cards" while the seed had four.
    viewport:
      width: 1000
      height: 700
    wait_for: '.MuiChip-root:visible'
    alt: >
      The ECTLogger dashboard, showing a grid of net cards, each with a
      status chip reading active, scheduled, or closed.
    caption: Nets you can still take part in sort ahead of ones that are over.

  - id: archived-nets-dialog
    section: operators
    page: /docs/operators/finding-a-net/
    route: /dashboard
    as: KC1HILL
    wait_for: 'button[aria-label="view archived"]:visible'
    steps:
      - click: 'button[aria-label="view archived"]'
      - wait_for: '.MuiDialog-paper:visible'
    element: '.MuiDialog-paper'
    pad: 12
    alt: >
      The Archived and Cancelled Nets dialog, with a search box, From and To
      date fields, and Attended and Ran as NCS checkboxes.
    caption: Everything closed, archived, or cancelled lives here, not just this week's nets.

  # The Schedule page's month calendar. The view toggle is persisted per
  # browser, and each capture starts in a fresh one, so switch to it first.
  - id: schedule-calendar
    section: operators
    page: /docs/operators/finding-a-net/
    route: /scheduler
    # 1000 wide so the figure reads at full size in the docs column.
    viewport:
      width: 1000
      height: 1000
    as: KC1HILL
    wait_for: 'button[aria-label="calendar view"]:visible'
    steps:
      - click: 'button[aria-label="calendar view"]'
      - wait_for: 'button[aria-label="next month"]:visible'
      - wait: 800
    hide:
      - '.MuiTooltip-popper'
    annotate:
      - selector: 'button[aria-label="calendar view"]'
        style: box
    alt: >
      The Schedule page in calendar view: a month grid with each net on its
      day, showing its start time, name, and NCS callsign. The Calendar view
      button at the top right is outlined in red.
    caption: Past days show what actually happened; today forward shows what's coming up, including who is on NCS.

  # The details popover for one occurrence: this date's NCS and outcome on
  # top, then the schedule's usual card.
  - id: schedule-calendar-details
    section: operators
    page: /docs/operators/finding-a-net/
    route: /scheduler
    as: KC1HILL
    wait_for: 'button[aria-label="calendar view"]:visible'
    steps:
      - click: 'button[aria-label="calendar view"]'
      - wait_for: '.MuiPaper-outlined button[type="button"]:visible'
      - click: '.MuiPaper-outlined button[type="button"]'
      - wait_for: '.MuiPopover-paper:visible'
    element: '.MuiPopover-paper'
    pad: 12
    alt: >
      The details for one net on the calendar: its date and time, who is on
      NCS, and below that the schedule's usual card with its frequencies, net
      manager, and buttons.
    caption: Click any net on the calendar for that date's details and the schedule's usual card.

  - id: schedule-calendar-phone
    section: operators
    page: /docs/operators/finding-a-net/
    route: /scheduler
    as: KC1HILL
    mobile: true
    viewport:
      width: 390
      height: 844
    wait_for: 'button[aria-label="calendar view"]:visible'
    steps:
      - click: 'button[aria-label="calendar view"]'
      - wait_for: 'button[aria-label="next month"]:visible'
      - wait: 800
    alt: >
      The Schedule page's calendar on a phone, listed as days with each day's
      nets under it instead of a month grid.
    hide:
      - '.MuiTooltip-popper'
    caption: On a phone, the month is listed day by day.

  # ========== Checking in ==========
  # KC1HILL is already checked into the seeded active net, so the check-in
  # dialog and its toolbar entry point aren't on screen until there's no
  # active check-in for this user. Checking out first (a real, reachable
  # control -- see status-and-checking-out.md) reproduces a station
  # rechecking in, which opens the same dialog a first-time check-in would.
  - id: check-in-dialog
    section: operators
    page: /docs/operators/checking-in/
    route: /nets/{{net:active}}
    # N1DUNE is seeded checked into nothing, so this opens the dialog without
    # first checking someone out -- which rewrote the demo database.
    as: N1DUNE
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'span[aria-label="Check into net"]'
      - wait_for: '.MuiDialog-paper:visible'
    element: '.MuiDialog-paper'
    pad: 16
    annotate:
      - selector: 'div.MuiDialogActions-root button:has-text("Check In")'
        style: box
    alt: >
      The Check In dialog, with the Check In button outlined in red at the
      bottom right of the form. Only the Callsign field is required by
      default.
    caption: Only Callsign is required unless the net's manager has turned on more fields.

  # ========== Status, rechecks, and checking out ==========
  - id: check-in-legend
    section: operators
    page: /docs/operators/status-and-checking-out/
    route: /nets/{{net:active}}
    as: KC1HILL
    wait_for: 'table:visible tbody tr'
    # The table marks a second active NCS with the same tooltip the legend key
    # carries, so both selectors have to be scoped to the legend strip itself
    # or they resolve to a row instead.
    element: 'div:has(> span:text-is("Legend:"))'
    pad: 8
    annotate:
      - selector: 'div:has(> span:text-is("Legend:")) span[aria-label="2nd NCS - assists primary Net Control Station"]'
        style: underline
    alt: >
      The check-in list legend, with the '2nd NCS' entry underlined in red,
      reading '2nd NCS - assists primary Net Control Station'.
    caption: The legend mixes roles (NCS, 2nd NCS, Logger), statuses, and the recheck marker in one row.

  - id: status-select-dropdown
    section: operators
    page: /docs/operators/status-and-checking-out/
    route: /nets/{{net:active}}
    # 1000 wide so the figure reads at full size in the docs column.
    viewport:
      width: 1000
      height: 1000
    as: KC1HILL
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'tr:has-text("KC1HILL") .MuiSelect-select'
      - wait_for: '.MuiMenu-paper:visible'
    # Clicking the select leaves its tooltip showing over the next column.
    hide:
      - '.MuiTooltip-popper'
    # The table itself, not its scroll container: the container reserves empty
    # space below the last row that reads as a broken screenshot.
    element:
      - 'table'
      - '.MuiMenu-paper'
    pad: 8
    alt: >
      A check-in row's status dropdown open, listing Checked in, Listening,
      Relay, Away, Has traffic, Announcements, Mobile, In person, and
      Checked out.
    caption: Every status is one dropdown away, on your own row.

  - id: self-status-toolbar
    section: operators
    page: /docs/operators/status-and-checking-out/
    route: /nets/{{net:active}}
    # KC1HILL is seeded checked in with a raised hand, so this is also the one
    # figure that shows what that button looks like once it is up: Lower hand.
    as: KC1HILL
    wait_for: 'table:visible tbody tr'
    # The union of the four buttons, not the whole toolbar: a full-width
    # toolbar strip is 1440px of content in a 330px phone column, which scales
    # its labels down to about three pixels and makes the figure useless on
    # exactly the device most likely to be reading it.
    element:
      - 'span[aria-label="Lower hand"]'
      - 'span[aria-label="Check out of net"]'
    pad: 6
    annotate:
      - selector: 'span[aria-label="Step away"]'
        style: box
      - selector: 'span[aria-label="Mark yourself as just listening (not transmitting)"]'
        style: box
    alt: >
      The right-hand end of the net toolbar once you are checked in: a
      highlighted Lower hand button, then Step away and Just listening both
      outlined in red, then Check out in red.
    caption: >
      The two statuses you actually reach for mid-net have their own buttons,
      so you never have to find your own row.

  # ========== Chat, polls, and topics ==========
  - id: chat-mention-composer
    section: operators
    page: /docs/operators/chat-and-polls/
    route: /nets/{{net:active}}
    # The autocomplete only suggests stations currently signed in, so the menu
    # cannot open unless a second operator is really connected to this net.
    with_online: [K1COVE]
    as: KC1HILL
    wait_for: 'textarea[placeholder="Type a message, @callsign, or paste an image..."]:visible'
    steps:
      - click: 'textarea[placeholder="Type a message, @callsign, or paste an image..."]'
      - fill:
          selector: 'textarea[placeholder="Type a message, @callsign, or paste an image..."]'
          value: '@K'
      # MUI v5's MenuList renders a plain MuiList-root. There is no
      # MuiMenuList-root class to wait for.
      - wait_for: '.MuiPopper-root .MuiMenuItem-root'
    # The autocomplete is portaled to the body, so the figure is the union of
    # the composer and the list floating above it.
    element:
      - 'textarea[placeholder="Type a message, @callsign, or paste an image..."]'
      - '.MuiPopper-root'
    pad: 16
    alt: >
      The chat composer containing the text '@K', with an autocomplete list
      open above it offering K1COVE and KC1HILL.
    caption: Typing the first letter or two narrows the list to matching stations.

  # ========== Your location and the map ==========
  - id: location-map
    section: operators
    page: /docs/operators/location-and-the-map/
    route: /nets/{{net:active}}
    # 1000 wide so the figure reads at full size in the docs column.
    viewport:
      width: 1000
      height: 1000
    as: KC1HILL
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'span[aria-label="View check-in locations on map"]'
      - wait_for: '.leaflet-container:visible'
      - wait: 800
    alt: >
      A net's live check-in map, with colored markers for each station and a
      legend identifying NCS, Logger, Relay, and station statuses.
    caption: Every checked-in station with a location ECTLogger can parse, including ones already checked out.

  # ========== Filing traffic ==========
  # The net toolbar's Traffic button is gated on owner/admin/active NCS/Logger
  # (NetView.tsx::canViewNetTraffic), so a participant never sees it. The
  # operator path shows the route a participant actually has: the Traffic item
  # in the top navigation bar.
  - id: traffic-nav-item
    section: operators
    page: /docs/operators/filing-traffic/
    route: /nets/{{net:active}}
    as: KC1HILL
    wait_for: 'table:visible tbody tr'
    # The menu items, not the whole 1440px header.
    element:
      - 'header >> text=Nets'
      - 'header >> text=Help'
    pad: 12
    annotate:
      - selector: 'header >> text=Traffic'
        style: box
    alt: >
      The top navigation bar, with the Traffic item outlined in red, between
      Schedule and Stats.
    caption: >
      Traffic in the top navigation bar. When something is waiting on you, a
      count appears beside it.
  - id: traffic-composer-picker
    section: operators
    page: /docs/operators/filing-traffic/
    route: /traffic
    # 1000 wide so the figure reads at full size in the docs column.
    viewport:
      width: 1000
      height: 1000
    as: KC1HILL
    wait_for: 'body:visible'
    steps:
      - click: 'button:has-text("New")'
      - wait_for: '.MuiCard-root:visible'
    alt: >
      The traffic composer's form-type picker, showing five cards: ARRL
      Radiogram, GYX-CAR SKYWARN Report, ICS-213 General Message Form, RRI
      Strip (General), and RRI WXOBS Weather Observation.
    caption: Only the types a net's manager enabled are offered here -- asking for an unusual type is still possible through the standalone Traffic section below.

  # ========== Your statistics ==========
  - id: activity-stat-cards
    section: operators
    page: /docs/operators/your-statistics/
    route: /profile
    as: KC1HILL
    viewport:
      width: 1000
      height: 700
    wait_for: '[aria-label="profile tabs"]:visible'
    steps:
      - click: '[aria-label="profile tabs"] button:has-text("Activity")'
      - wait_for: 'text=Total Check-ins'
    alt: >
      The Profile Activity tab's stat cards: Total Check-ins, Nets Joined,
      As NCS, and Last 30 Days.
    caption: Click any card to see the nets behind the number.

  - id: leaderboard-table
    section: operators
    page: /docs/operators/your-statistics/
    route: /statistics/schedules/{{template:weekly}}
    # 1000 wide so the figure reads at full size in the docs column.
    viewport:
      width: 1000
      height: 1000
    as: KC1HILL
    wait_for: 'table:visible'
    steps:
      - click: 'button[role="tab"]:has-text("Check-ins")'
      - wait_for: 'table:visible tbody tr'
    alt: >
      A schedule statistics page's check-in leaderboard, listing callsigns
      with their appearance count and participation percentage, medal icons
      next to the top three rows.
    caption: The check-in leaderboard for a recurring net, filtered to the last 90 days.

  # ========== On a phone in the field ==========
  - id: mobile-checkin-list
    section: operators
    page: /docs/operators/in-the-field/
    route: /nets/{{net:active}}
    as: KC1HILL
    mobile: true
    viewport:
      width: 390
      height: 844
    wait_for: 'table:visible tbody tr'
    alt: >
      The check-in list on a phone-width screen: a simplified, read-only
      table with each station's status shown by icon.
    caption: Other stations' rows are read-only on a phone; your own status is still yours to change.

  # ========== Signing in ==========
  # The password and two-factor controls all live on one tab, so these three
  # share a click path. Each is captured as its own card rather than as one
  # figure of the whole tab: the page walks through them as separate jobs, and
  # a figure with two red boxes on it cannot say which one this step means.
  - id: login-password-link
    section: operators
    page: /docs/operators/signing-in/
    route: /login
    # No "as": the sign-in page is what a signed-out visitor sees.
    viewport:
      width: 1440
      height: 900
    wait_for: 'input[name="email"]'
    element: '.MuiPaper-root:has(input[name="email"])'
    pad: 16
    annotate:
      - selector: 'button:has-text("Sign in with a password instead")'
        style: box
    alt: >
      The ECTLogger sign-in page, with the Sign in with a password instead
      link outlined in red below the Send Magic Link button.
    caption: Easy to miss, because most people never need it. It is at the bottom of the sign-in page.

  - id: security-email-card
    section: operators
    page: /docs/operators/signing-in/
    route: /profile
    as: KC1HILL
    wait_for: '[aria-label="profile tabs"]:visible'
    steps:
      - click: '[aria-label="profile tabs"] button:has-text("Security")'
      - wait_for: 'text=Sign-in email'
      # Typed in so the button reads as it does in use, not greyed out.
      - fill: { selector: 'form:has(label:has-text("New email")) input[type="email"]', text: 'priya.nandan@example.org' }
    element:
      - 'h6:has-text("Sign-in email")'
      - 'form:has(label:has-text("New email"))'
    pad: 16
    annotate:
      - selector: 'form:has(label:has-text("New email")) button[type="submit"]'
        style: box
    alt: >
      The Sign-in email section at the top of the Profile page's Security tab.
      It names the address the account signs in with, above a New email field
      holding a new address and the Send link button, outlined in red.
    caption: >
      The link goes to the new address. Nothing changes until it is opened
      there.

  - id: security-backup-emails
    section: operators
    page: /docs/operators/signing-in/
    route: /profile
    as: KC1HILL
    wait_for: '[aria-label="profile tabs"]:visible'
    steps:
      - click: '[aria-label="profile tabs"] button:has-text("Security")'
      - wait_for: 'text=priya.home@example.org'
      # Typed in so the button reads as it does in use, not greyed out.
      - fill: { selector: 'form:has(label:has-text("Backup email")) input[type="email"]', text: 'priya.work@example.org' }
    element:
      - 'h6:has-text("Backup emails")'
      - 'form:has(label:has-text("Backup email"))'
    pad: 16
    annotate:
      - selector: 'form:has(label:has-text("Backup email")) button[type="submit"]'
        style: box
    alt: >
      The Backup emails section of the Profile page's Security tab. One backup
      address, priya.home@example.org, is listed with Make primary and Remove
      buttons beside it. Below, a Backup email field holds a second address
      and the Send link button is outlined in red.
    caption: >
      Each backup is added only once the link sent to it is opened.

  - id: security-password-card
    section: operators
    page: /docs/operators/signing-in/
    route: /profile
    as: KC1HILL
    wait_for: '[aria-label="profile tabs"]:visible'
    steps:
      - click: '[aria-label="profile tabs"] button:has-text("Security")'
      - wait_for: 'text=Confirm Password'
    # Every seeded demo account already has a password, so the button reads
    # Change Password here. The page says both labels for that reason.
    # Heading and form as a union: the form alone starts below the sentence
    # that says what a password is for.
    element:
      - 'h6:has-text("Password")'
      - 'form:has(input[name="new-password"])'
    pad: 16
    annotate:
      - selector: 'form:has(input[name="new-password"]) button[type="submit"]'
        style: box
    alt: >
      The Password section of the Profile page's Security tab, with Current
      Password, New Password, and Confirm Password fields and the Change
      Password button outlined in red below them.
    caption: A password is a fallback, not a replacement. The magic link keeps working whether you set one or not.

  - id: security-two-factor-setup
    section: operators
    page: /docs/operators/signing-in/
    route: /profile
    as: KC1HILL
    wait_for: '[aria-label="profile tabs"]:visible'
    steps:
      - click: '[aria-label="profile tabs"] button:has-text("Security")'
      - wait_for: 'button:has-text("Set Up Two-Factor Authentication")'
    # The enrollment screen itself is deliberately not captured: it shows a
    # working QR code for whichever account was photographed, and a figure of
    # a real second factor is not a figure worth publishing.
    element:
      - 'h6:has-text("Two-Factor Authentication")'
      - 'button:has-text("Set Up Two-Factor Authentication")'
    pad: 16
    annotate:
      - selector: 'button:has-text("Set Up Two-Factor Authentication")'
        style: box
    alt: >
      The Two-Factor Authentication section of the Security tab, explaining
      that it adds a 6-digit code from an authenticator app, with the Set Up
      Two-Factor Authentication button outlined in red.
    caption: Directly below the password section on the same tab.

  # ========== Subscribe link landing page ==========
  # Signed out on purpose: that is how most people sent a link arrive.
  - id: subscribe-page
    section: operators
    page: /docs/operators/finding-a-net/
    route: /subscribe/{{template:weekly}}
    wait_for: 'button:has-text("Sign in to subscribe")'
    element: 'main .MuiPaper-root'
    pad: 16
    annotate:
      - selector: 'button:has-text("Sign in to subscribe")'
        style: box
    alt: >
      The page a subscribe link opens, for a visitor who is not signed in:
      the net's name, description, when it runs, and its frequencies, with
      the Sign in to subscribe button outlined in red.
    caption: >
      The page names the net before asking for anything, so you know what
      you're subscribing to.

  # ========== Reporting what you hear ==========
  # All from the seeded Example County ARES Simplex Drill ({{net:coverage}}),
  # the only net with station-to-station coverage logging on. KC1HILL's
  # earlier reports were entered for them by the Logger, which is what the
  # profile map figure below depends on.
  - id: i-hear-button
    section: operators
    page: /docs/operators/reporting-what-you-hear/
    route: /nets/{{net:coverage}}
    as: KC1HILL
    wait_for: 'table:visible tbody tr'
    element:
      - 'span[aria-label="Mark yourself as just listening (not transmitting)"]'
      - 'span[aria-label="Check out of net"]'
    pad: 6
    annotate:
      - selector: 'span[aria-label="Record which stations you can hear"]'
        style: box
    alt: >
      The right-hand end of the net toolbar once you are checked in: Just
      listening, then I hear outlined in red, then Check out.
    caption: I hear only appears on a net that has coverage logging turned on.

  - id: i-hear-select-all
    section: operators
    page: /docs/operators/reporting-what-you-hear/
    route: /nets/{{net:coverage}}
    as: KC1HILL
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'span[aria-label="Record which stations you can hear"]'
      - wait_for: '.MuiDialog-paper:visible'
      - click: '.MuiDialog-paper label:has-text("All stations")'
      - click: '.MuiDialog-paper label:has-text("W2FERN")'
      - click: '.MuiDialog-paper label:has-text("N2OAKS")'
    element: '.MuiDialog-paper'
    pad: 16
    annotate:
      - selector: '.MuiDialog-paper label:has-text("All stations")'
        style: box
    alt: >
      The Who can KC1HILL hear? dialog. All stations, outlined in red at the
      top, shows a dash because most stations are ticked. Below it every
      station is ticked except W2FERN and N2OAKS. W1MILL is ticked and greyed
      out, marked checked out. The Operating Position field reads Home, above
      Cancel and Save.
    caption: >
      "Everybody but W2FERN and N2OAKS" is three clicks: All stations, then
      the two you didn't hear.

  - id: profile-coverage-map
    section: operators
    page: /docs/operators/reporting-what-you-hear/
    route: /profile?tab=coverage
    as: KC1HILL
    viewport:
      width: 1440
      height: 900
    wait_for: '.leaflet-marker-icon:visible'
    # The tab opens at a fixed regional zoom that fits all of New England;
    # two steps in makes the stations themselves readable.
    steps:
      - click: '.leaflet-control-zoom-in'
      - wait: 600
      - click: '.leaflet-control-zoom-in'
      - wait: 1500
      - hover: 'h6:has-text("Your Home Station Coverage")'
    element:
      - 'h6:has-text("Your Home Station Coverage")'
      - 'text=This map shows only stations'
    pad: 16
    alt: >
      The Coverage tab of the Profile page, headed Your Home Station
      Coverage, with a map of the lakes region and coast of southern Maine
      showing a marker for each station KC1HILL has heard from home, and a
      note below that the map only shows stations they heard.
    caption: Every station you've heard from home, across every net, on one map.

  # ========== Profile photo ==========
  - id: profile-photo-crop
    section: operators
    page: /docs/operators/account-and-profile/
    route: /profile
    as: KC1HILL
    wait_for: 'form:visible'
    steps:
      # The fixture is a drawn radio tower, not anyone's face.
      - upload:
          selector: 'input[type=file][accept*="image"]'
          file: scripts/docs-screenshots/fixtures/example-profile-photo.jpg
          mime_type: image/jpeg
      - wait_for: '.MuiDialog-paper:has-text("Crop Profile Photo")'
      - wait: 600
    element: '.MuiDialog-paper'
    pad: 12
    annotate:
      - selector: '.MuiDialog-paper button:has-text("Crop & Upload")'
        style: box
    alt: >
      The Crop Profile Photo window, with a photo of a radio tower on a hill
      inside a circular crop guide, a Zoom slider below it, and Cancel and
      Crop & Upload buttons. Crop & Upload is outlined in red.
    caption: Position the photo in the circle, then Crop & Upload. Only what's inside the square is saved.

  # ========== Prior topics ==========
  - id: prior-topics
    section: operators
    page: /docs/operators/chat-and-polls/
    route: /nets/{{net:active}}
    as: KC1HILL
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'span[aria-label="View prior topics"] button'
      - wait_for: '.MuiDialog-paper:has-text("Prior Topics")'
      # The list loads after the dialog opens; wait for a seeded topic.
      - wait_for: '.MuiDialog-paper >> text=go-kit'
      - wait: 400
