# Figures owned by the Administrators path (docs/admins/).
#
# Every shot here signs in as W1DEMO, the seeded admin -- the only seeded
# account with MFA enrolled, which app/dependencies.py::get_admin_user
# requires before the admin panel will render anything at all. None of these
# steps click Save/Create/Update on any form: they only open the admin
# panel, switch tabs, and let selectors/annotations point at controls, so
# capturing them never mutates the shared demo instance's settings or data.
#
# See ../README.md for the field reference.

shots:
  # ========== USERS TAB ==========
  - id: user-row-actions
    section: admins
    page: /docs/admins/users-and-roles/
    route: /admin/users
    as: W1DEMO
    wait_for: 'table:visible tbody tr'
    # W1PINE (seeded NCS) rather than W1DEMO's own row -- the admin's own
    # row disables Edit User/Ban/Delete (an admin cannot edit, ban, or
    # delete themselves), which would make for a confusing "click here" figure.
    element: 'tr:has-text("W1PINE")'
    pad: 8
    # No labels on these three. The icons sit about 30px apart and the tags
    # are 80-130px wide, so they overlapped each other and the row above into
    # an unreadable stack. The alt and the caption name them in order instead.
    annotate:
      - selector: 'tr:has-text("W1PINE") button[title="Edit User"]'
        style: box
      - selector: 'tr:has-text("W1PINE") button[title="Ban User"]'
        style: box
      - selector: 'tr:has-text("W1PINE") button[title="Reset Password"]'
        style: box
    alt: >
      A row in the admin Users table for Alex Reed, W1PINE, with three of its
      five action icons outlined in red: the pencil (Edit User), the
      circle-with-a-slash beside it (Ban), and the key two icons further along
      (Reset password). The stopwatch between them and the trash can at the end
      are not outlined.
    caption: >
      Every row in the Users table carries the same five actions. Edit User
      and Ban are covered here; Reset password and the two-factor reset next
      to it are covered in Security, MFA, and lockouts.

  - id: change-role-dialog
    section: admins
    page: /docs/admins/users-and-roles/
    route: /admin/users
    as: W1DEMO
    wait_for: 'table:visible tbody tr'
    # The dropdown is opened rather than left closed: part of the caption
    # below is about which four roles are on offer, and a closed picker
    # showing only the current one does not show them. MUI portals the menu
    # to the end of <body>, so the clip is the union of the dialog and the
    # menu paper.
    steps:
      - click: 'tr:has-text("W1PINE") button[title="Edit User"]'
      - wait_for: '.MuiDialog-paper'
      - click: '.MuiDialog-paper .MuiSelect-select'
      - wait_for: '.MuiPopover-paper .MuiMenuItem-root'
    element:
      - '.MuiDialog-paper'
      - '.MuiPopover-paper'
    pad: 12
    annotate:
      - selector: '.MuiDialog-paper input[type="email"]'
        style: box
      - selector: '.MuiDialog-paper .MuiSelect-select'
        style: box
    alt: >
      The Edit User dialog, open for W1PINE, with the Name, Callsign, and
      Email fields (each with its own padlock icon) above an open Role
      picker outlined in red, offering Guest, User, NCS, and Admin.
    caption: >
      Name, callsign, email, and role all live in one dialog. Changing the
      email is how you recover an account that lost access to the address
      it signed up with -- both the old and new address get notified. The
      padlock on each field stops the person from changing it themselves
      afterward.

  - id: self-mfa-reset-disabled
    section: admins
    page: /docs/admins/security-and-mfa/
    route: /admin/users
    as: W1DEMO
    wait_for: 'table:visible tbody tr'
    element: 'tr:has-text("W1DEMO")'
    pad: 8
    annotate:
      - selector: 'tr:has-text("W1DEMO") button[title="Reset Two-Factor Authentication"]'
        style: box
    alt: >
      The admin's own row in the Users table, with the two-factor reset icon
      outlined in red and greyed out because it is disabled.
    caption: >
      An admin can reset anyone else's two-factor authentication from this
      table, but never their own -- that would defeat the point of making it
      mandatory. Ask another admin, or see the recovery path below if none
      is available.

  # ========== CHECK-IN FIELDS TAB ==========
  - id: fields-table
    section: admins
    page: /docs/admins/custom-fields/
    route: /admin/users
    as: W1DEMO
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'button[role="tab"]:has-text("Check-in Fields")'
      - wait_for: 'table:visible tbody tr'
    element: 'table'
    pad: 8
    annotate:
      - selector: 'tr:has-text("Shelter Capacity") [aria-label="Archive"]'
        style: box
    alt: >
      The check-in fields table with columns Name, Label, Type, Default
      Enabled, Default Required, Spam Guard, Status, and Actions. Eight rows
      are marked Built-in and carry an edit pencil only; one row,
      shelter_capacity / Shelter Capacity, is marked Custom and carries an
      archive icon as well, outlined in red.
    caption: >
      The Status column is what tells the two apart. A field marked Built-in
      can be edited but never archived; a Custom field like Shelter Capacity
      can be archived instead of deleted, so past check-ins that used it stay
      readable.

  # ========== FREQUENCIES TAB ==========
  - id: frequency-in-use-row
    section: admins
    page: /docs/admins/frequencies/
    route: /admin/users
    as: W1DEMO
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'button[role="tab"]:has-text("Frequencies")'
      - wait_for: 'table:visible tbody tr'
    element: 'tr:has-text("146.940")'
    pad: 8
    annotate:
      - selector: 'tr:has-text("146.940") span[aria-label="Cannot delete: frequency is in use"]'
        style: box
    alt: >
      A frequency row in the shared frequency list reading 146.940, FM,
      "Example County ARES Repeater (PL 100.0)", with a "Nets Using" count of
      3 and a delete icon, outlined in red, greyed out and disabled.
    caption: >
      A frequency already picked by at least one net can be edited but not
      deleted. The count shows how many nets would be affected.

  # ========== BRANDING TAB ==========
  - id: branding-default-theme
    section: admins
    page: /docs/admins/branding-and-themes/
    route: /admin/users
    as: W1DEMO
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'button[role="tab"]:has-text("Branding")'
      - wait_for: 'text=Default Theme'
    element: '.MuiCard-root:has-text("Default Theme")'
    pad: 8
    annotate:
      - selector: 'button:has-text("Set as System Default")'
        style: box
    alt: >
      The Default Theme card on the Branding tab, with five named colour
      swatches -- ECTLogger Blue (currently selected, ticked), Ocean, Forest,
      Sunset, and Berry -- and a "Set as System Default" button outlined in
      red, greyed out because the selected swatch is already the default.
    caption: >
      Applies only to visitors who have never picked a theme of their own in
      Profile → Settings.

  - id: branding-logo
    section: admins
    page: /docs/admins/branding-and-themes/
    route: /admin/users
    as: W1DEMO
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'button[role="tab"]:has-text("Branding")'
      - wait_for: 'text=Default Theme'
    element: '.MuiCard-root:has-text("Logo")'
    pad: 8
    annotate:
      - selector: 'button:has-text("Upload Logo")'
        style: box
    alt: >
      The Logo card on the Branding tab, with the current mark and an
      "Upload Logo" button outlined in red.
    caption: PNG, JPEG, WebP, or SVG, up to 2 MB.

  # ========== MAINTENANCE TAB ==========
  - id: maintenance-banner-settings
    section: admins
    page: /docs/admins/maintenance-banner/
    route: /admin/users
    as: W1DEMO
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'button[role="tab"]:has-text("Maintenance")'
      - wait_for: 'text=Banner Settings'
    element: '.MuiCard-root:has-text("Banner Settings")'
    pad: 8
    annotate:
      # No label tag: "Enable banner" is already printed beside the switch,
      # and the tag ran off the right-hand edge of the card repeating it.
      - selector: '.MuiCard-root:has-text("Banner Settings") .MuiSwitch-root'
        style: box
    alt: >
      The Banner Settings card on the Maintenance tab, with the "Enable
      banner" switch outlined in red, above the message field and the
      optional scheduled start/end times.
    caption: >
      Every signed-in and signed-out visitor sees this banner within about
      10 seconds of it being turned on.

  # ========== SECURITY TAB ==========
  - id: security-session-settings
    section: admins
    page: /docs/admins/security-and-mfa/
    route: /admin/users
    as: W1DEMO
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'button[role="tab"]:has-text("Security")'
      - wait_for: 'text=Session Settings'
    element: '.MuiCard-root:has-text("Session Settings")'
    pad: 8
    annotate:
      # No label on this one: the words "Rolling renewal" are already on the
      # screen immediately to the left of the switch, and a tag repeating them
      # only pushes the clip out past the right edge of the card.
      - selector: '.MuiCard-root:has-text("Session Settings") .MuiSwitch-root'
        style: box
    alt: >
      The Session Settings card on the Security tab, showing the session
      lifetime field in days and the "Rolling renewal" switch outlined in red.
    caption: >
      Changes apply to sessions issued from this point on -- anyone already
      signed in keeps the expiry they were issued.

  # ========== TRAFFIC TAB ==========
  - id: traffic-definitions-table
    section: admins
    page: /docs/admins/traffic-settings/
    route: /admin/users
    as: W1DEMO
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'button[role="tab"]:has-text("Traffic")'
      - wait_for: 'table:visible tbody tr'
    element: 'table'
    pad: 8
    annotate:
      - selector: 'tr:has-text("ARRL Radiogram") .MuiSwitch-root'
        style: box
    alt: >
      The traffic form definitions table with columns Title, Form Type,
      Version, Format, Status, Enabled, Sort Order, and Actions. Five rows,
      all marked Built-in and all enabled: ARRL Radiogram, GYX-CAR SKYWARN
      Report, ICS-213 General Message Form, RRI Strip (General), and RRI
      WXOBS Weather Observation. The Radiogram's Enabled switch is outlined
      in red.
    caption: >
      Turning a format off removes it from the type picker instantly. Past
      messages filed in that format are unaffected.

  # ========== CONTACTS TAB ==========
  - id: add-contact-button
    section: admins
    page: /docs/admins/contacts/
    route: /admin/users
    as: W1DEMO
    wait_for: 'table:visible tbody tr'
    steps:
      - click: 'button[role="tab"]:has-text("Contacts")'
      - wait: 500
    element: 'button[aria-label="add contact"]'
    pad: 20
    annotate:
      - selector: 'button[aria-label="add contact"]'
        style: box
    alt: >
      The add contact button, a plus icon in a circle at the bottom right of
      the Contacts tab, outlined in red.
    caption: >
      Most contacts appear on their own as stations check in. Use this to
      add someone before their first check-in.
