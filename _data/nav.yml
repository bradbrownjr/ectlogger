# Sidebar navigation for the documentation site.
#
# The order here is the order a person grows into: you take part in a net
# before you run one, you run one before you own the schedule, and you own a
# schedule before anyone hands you the admin panel. Self-hosting is a separate
# track rather than a fifth step, because running the server is a different job
# from administering an instance somebody else runs.
#
# Every entry needs a url with a leading and trailing slash, matching the
# page's own permalink, or the sidebar cannot tell which page you are on.

- title: Start here
  url: /docs/start/
  eyebrow: Tutorial
  summary: Three guided walkthroughs that each end with something real on the screen.
  items:
    - title: Check into your first net
      url: /docs/start/first-check-in/
    - title: Run your first net
      url: /docs/start/run-your-first-net/
    - title: Set up a recurring schedule
      url: /docs/start/first-schedule/

